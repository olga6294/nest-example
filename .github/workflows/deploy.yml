name: Run tests and deploy

on:
  workflow_dispatch:
  push:
    branches: ['main']

jobs:
  run-eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6

      - name: Install and setup NodeJS version
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESlint
        run: yarn lint

  run-test:
    needs: run-eslint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6

      - name: Install proper version of NodeJS
        uses: actions/setup-node@v6
        with: 
          node-version-file: package.json

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

  deploy:
    needs: [run-eslint, run-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Install proper version of NodeJS
        uses: actions/setup-node@v6
        with: 
          node-version-file: package.json

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build project
        run: yarn build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: My NestJS example app
          path: |
            dist
            package.json

      - name: Deploy
        run: echo 'Deploy, deploy, deploy...'